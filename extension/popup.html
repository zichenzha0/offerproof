<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=360" />
    <title>OfferProof</title>
    <style>
      :root {
        --bg: #f8fafc;
        --panel: #ffffff;
        --panel-2: #f1f5f9;
        --line: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --green: #059669;
        --green-dim: #ecfdf5;
        --amber: #d97706;
        --amber-dim: #fffbeb;
        --red: #e11d48;
        --red-dim: #fff1f2;
        --slate: #64748b;
        --slate-dim: #f1f5f9;
        --blue: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 360px;
        max-width: 360px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
      }

      body {
        min-height: 220px;
        overflow-x: hidden;
      }

      .shell {
        padding: 16px 16px 12px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .mark {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        background: #2563eb;
        border: 1px solid #1d4ed8;
        color: #fff;
        font-size: 12px;
      }

      .context {
        max-width: 180px;
        text-align: right;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
      }

      .context strong {
        display: block;
        color: var(--text);
        font-size: 12px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .banner {
        border-radius: 12px;
        padding: 14px 14px 13px;
        border: 1px solid transparent;
        margin-bottom: 12px;
      }

      .banner .kicker {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.8;
        margin-bottom: 4px;
      }

      .banner h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.25;
        letter-spacing: -0.03em;
        font-weight: 700;
      }

      .banner.real {
        background: var(--green-dim);
        border-color: #a7f3d0;
        color: #065f46;
      }

      .banner.warn {
        background: var(--amber-dim);
        border-color: #fde68a;
        color: #92400e;
      }

      .banner.bad {
        background: var(--red-dim);
        border-color: #fecdd3;
        color: #9f1239;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }

      .meter-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }

      .meter-head span {
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .meter-head strong {
        font-size: 12px;
        font-weight: 650;
      }

      .meter {
        height: 10px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
        border: 1px solid var(--line);
      }

      .meter > i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: var(--slate);
        transition: width 0.45s ease;
      }

      .meter.real > i {
        background: var(--green);
      }

      .meter.warn > i {
        background: var(--amber);
      }

      .meter.bad > i {
        background: var(--red);
      }

      .tier {
        display: inline-flex;
        margin-top: 10px;
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--panel-2);
        color: var(--muted);
        font-size: 11px;
        border: 1px solid var(--line);
      }

      .evidence {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      .row {
        display: grid;
        grid-template-columns: 22px 1fr;
        gap: 8px;
        padding: 9px 10px 9px 12px;
        border-radius: 10px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        box-shadow: inset 4px 0 0 var(--slate);
      }

      .row.hit {
        box-shadow: inset 4px 0 0 var(--green);
      }

      .row.miss {
        box-shadow: inset 4px 0 0 var(--red);
      }

      .row.error {
        box-shadow: inset 4px 0 0 var(--slate);
      }

      .icon {
        width: 18px;
        height: 18px;
        margin-top: 1px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
      }

      .row.hit .icon {
        color: var(--green);
        background: var(--green-dim);
      }

      .row.miss .icon {
        color: var(--red);
        background: var(--red-dim);
      }

      .row.error .icon {
        color: var(--slate);
        background: var(--slate-dim);
      }

      .row h2 {
        margin: 0;
        font-size: 12px;
        font-weight: 650;
      }

      .row p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .state {
        min-height: 180px;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 28px 16px;
        color: var(--muted);
      }

      .state h1 {
        margin: 10px 0 6px;
        color: var(--text);
        font-size: 16px;
        letter-spacing: -0.02em;
      }

      .state p {
        margin: 0;
        max-width: 260px;
        font-size: 12px;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid #dbeafe;
        border-top-color: var(--blue);
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      footer {
        margin-top: 12px;
        color: var(--muted);
        font-size: 10.5px;
        text-align: center;
        line-height: 1.4;
      }

      .report-btn {
        display: block;
        width: 100%;
        margin-top: 12px;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 650;
        padding: 9px 12px;
        cursor: pointer;
      }

      .report-btn:hover {
        background: #1d4ed8;
      }

      .search {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }

      .search input {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 10px;
        padding: 8px 10px;
        font: inherit;
        color: var(--text);
      }

      .search button {
        border: 0;
        border-radius: 10px;
        background: #0f172a;
        color: #fff;
        font: inherit;
        font-weight: 650;
        padding: 8px 10px;
        cursor: pointer;
      }

      .score-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .dial {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--panel-2);
        border: 4px solid var(--blue);
        flex-shrink: 0;
      }

      .dial strong {
        font-size: 22px;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .dial.real { border-color: var(--green); color: var(--green); }
      .dial.warn { border-color: var(--amber); color: var(--amber); }
      .dial.bad { border-color: var(--red); color: var(--red); }

      .score-copy h2 {
        margin: 0 0 2px;
        font-size: 15px;
        letter-spacing: -0.02em;
      }

      .score-copy p {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand">
          <span class="mark" aria-hidden="true">✓</span>
          OfferProof
        </div>
        <div class="context" id="context">Search or scan this tab</div>
      </header>
      <form class="search" id="search-form">
        <input id="company-input" type="text" placeholder="Company or domain — Apple, kalshi.com" autocomplete="off" />
        <button type="submit">Score</button>
      </form>
      <main id="root">
        <section class="card state" aria-live="polite">
          <div>
            <div class="spinner" aria-hidden="true"></div>
            <h1>Gathering evidence</h1>
            <p>Checking public records for this company…</p>
          </div>
        </section>
      </main>
      <footer>
        Click the score to open the dashboard. Reload the extension after updates.
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
